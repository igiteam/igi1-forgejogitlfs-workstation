<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OFP ~ IGI ~ LLM — Remake Workspace</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        height: 100vh;
        overflow: hidden;
        font-size: 13px;
      }

      .app-container {
        display: flex;
        height: 100vh;
        width: 100%;
        overflow: hidden;
      }

      .panel {
        height: 100%;
        position: relative;
        overflow: hidden;
        background: #0f172a;
        display: flex;
        flex-direction: column;
        min-width: 0;
        flex: 0 0 auto;
      }

      .resizer {
        width: 8px;
        background: #1e293b;
        cursor: col-resize;
        flex: 0 0 auto;
        user-select: none;
        transition: background 0.1s;
        position: relative;
        z-index: 10;
      }
      .resizing iframe {
        pointer-events: none !important;
      }
      .resizer:hover {
        background: #334155;
      }
      .resizer::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 2px;
        height: 30px;
        background: #475569;
        border-radius: 1px;
      }

      .panel-header {
        background: #1e293b;
        padding: 8px 12px;
        border-bottom: 2px solid #334155;
        display: flex;
        align-items: center;
        gap: 8px;
        height: 44px;
        flex-shrink: 0;
      }

      .panel-title {
        font-weight: 600;
        color: #38bdf8;
        background: rgba(56, 189, 248, 0.1);
        padding: 4px 10px;
        border-radius: 4px;
        border: 1px solid #38bdf8;
        font-size: 12px;
        white-space: nowrap;
      }

      .panel-header .url-text {
        color: #64748b;
        font-size: 11px;
        font-family: "Consolas", monospace;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .panel-header .open-btn {
        margin-left: auto;
        color: #94a3b8;
        text-decoration: none;
        font-size: 11px;
        padding: 3px 8px;
        border: 1px solid #334155;
        border-radius: 4px;
        white-space: nowrap;
      }
      .panel-header .open-btn:hover {
        color: #e2e8f0;
        border-color: #475569;
      }

      /* RAG strip — only on panels 1 and 3 */
      .rag-strip {
        background: #1e293b;
        padding: 8px 12px;
        border-bottom: 1px solid #334155;
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
      }

      .rag-badge {
        color: #60a5fa;
        font-weight: 600;
        font-size: 11px;
        min-width: 34px;
      }

      .rag-input {
        flex: 1;
        background: #0f172a;
        border: 1px solid #334155;
        color: #60a5fa;
        padding: 6px 10px;
        border-radius: 4px;
        font-size: 11px;
        font-family: "Consolas", monospace;
        height: 30px;
        cursor: pointer;
      }
      .rag-input:hover {
        background: #334155;
      }
      .rag-input:focus {
        outline: none;
        border-color: #60a5fa;
      }

      .mini-btn {
        background: #334155;
        border: 1px solid #475569;
        color: #cbd5e1;
        padding: 6px 10px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 11px;
        white-space: nowrap;
        height: 30px;
      }
      .mini-btn:hover {
        background: #475569;
      }

      .mini-btn.primary {
        background: linear-gradient(135deg, #7c3aed 0%, #8b5cf6 100%);
        border-color: #8b5cf6;
        color: white;
      }

      .iframe-container {
        flex: 1;
        position: relative;
        background: #0f172a;
        overflow: hidden;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: none;
        background: white;
      }

      /* Quick bar */
      .quick-load-bar {
        background: #1e293b;
        padding: 6px 12px;
        border-top: 1px solid #334155;
        display: flex;
        align-items: center;
        gap: 8px;
        height: 40px;
        flex-shrink: 0;
      }

      .quick-label {
        color: #94a3b8;
        font-size: 11px;
        white-space: nowrap;
      }

      .quick-url-input {
        flex: 1;
        background: #0f172a;
        border: 1px solid #334155;
        color: #e2e8f0;
        padding: 5px 8px;
        border-radius: 4px;
        font-size: 11px;
        font-family: "Consolas", monospace;
        height: 28px;
      }

      .quick-btn {
        background: #334155;
        border: 1px solid #475569;
        color: #cbd5e1;
        padding: 5px 10px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 11px;
        white-space: nowrap;
        height: 28px;
      }
      .quick-btn:hover {
        background: #475569;
      }
      .quick-btn.primary {
        background: linear-gradient(135deg, #7c3aed 0%, #8b5cf6 100%);
        border-color: #8b5cf6;
        color: white;
      }

      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1e293b;
      }
      ::-webkit-scrollbar-thumb {
        background: #475569;
        border-radius: 4px;
      }
    </style>
  </head>

  <body>
    <div class="app-container">
      <!-- ============ PANEL 1: OFP / CWR on GitHub ============ -->
      <div class="panel" id="panel-1">
        <div class="panel-header">
          <span class="panel-title">OFP · CWR</span>
          <span class="url-text">github.com/BohemiaInteractive/CWR</span>
          <a
            class="open-btn"
            href="https://github.com/BohemiaInteractive/CWR"
            target="_blank"
            rel="noopener"
            >open ↗</a
          >
        </div>

        <!-- RAG strip for this panel -->
        <div class="rag-strip">
          <span class="rag-badge">RAG</span>
          <input
            type="text"
            class="rag-input"
            id="rag-1"
            readonly
            onclick="this.select()"
            placeholder="RAG link for CWR source"
          />
          <button class="mini-btn" onclick="copyRag(1)">📋</button>
          <button
            class="mini-btn"
            onclick="addRagToQuick(1)"
            title="Add to DeepSeek context"
          >
            🔗
          </button>
        </div>

        <div class="iframe-container" id="iframe-container-1">
          <iframe
            id="iframe-1"
            src="https://github.com/BohemiaInteractive/CWR"
            referrerpolicy="no-referrer"
            loading="lazy"
          ></iframe>
        </div>
      </div>

      <!-- Resizer -->
      <div class="resizer" id="resizer-1"></div>

      <!-- ============ PANEL 2: LibreChat chat ============ -->
      <div class="panel" id="panel-2">
        <div class="panel-header">
          <span class="panel-title">LibreChat</span>
          <span class="url-text"
            >https://chat.librechat.ai/c/32a6d101-fef2-5f9b-8f70-2deb87b8c51b</span
          >
          <a
            class="open-btn"
            href="https://chat.librechat.ai/c/32a6d101-fef2-5f9b-8f70-2deb87b8c51b"
            target="_blank"
            rel="noopener"
            >open ↗</a
          >
        </div>

        <div class="iframe-container" id="iframe-container-2">
          <iframe
            id="iframe-2"
            src="https://chat.librechat.ai/c/32a6d101-fef2-5f9b-8f70-2deb87b8c51b"
            referrerpolicy="no-referrer"
            loading="lazy"
          ></iframe>
        </div>
      </div>

      <!-- Resizer -->
      <div class="resizer" id="resizer-2"></div>

      <!-- ============ PANEL 3: IGI research on GitHub ============ -->
      <div class="panel" id="panel-3">
        <div class="panel-header">
          <span class="panel-title">IGI · research</span>
          <span class="url-text"
            >github.com/heaven-hm/project-igi-research-data</span
          >
          <a
            class="open-btn"
            href="https://github.com/heaven-hm/project-igi-research-data/tree/main"
            target="_blank"
            rel="noopener"
            >open ↗</a
          >
        </div>

        <!-- RAG strip for this panel -->
        <div class="rag-strip">
          <span class="rag-badge">RAG</span>
          <input
            type="text"
            class="rag-input"
            id="rag-3"
            readonly
            onclick="this.select()"
            placeholder="RAG link for IGI research"
          />
          <button class="mini-btn" onclick="copyRag(3)">📋</button>
          <button
            class="mini-btn"
            onclick="addRagToQuick(3)"
            title="Add to DeepSeek context"
          >
            🔗
          </button>
        </div>

        <div class="iframe-container" id="iframe-container-3">
          <iframe
            id="iframe-3"
            src="https://github.com/heaven-hm/project-igi-research-data/tree/main"
            referrerpolicy="no-referrer"
            loading="lazy"
          ></iframe>
        </div>
      </div>
    </div>

    <!-- Quick bar: builds the context that DeepSeek receives -->
    <div class="quick-load-bar">
      <span class="quick-label">Context →</span>
      <input
        type="text"
        class="quick-url-input"
        id="quick-url-input"
        placeholder="RAG context — click 🔗 on panel 1 or 3 to add sources"
      />
      <button class="quick-btn" onclick="copyQuick()">📋 Copy</button>
      <button class="quick-btn primary" onclick="openInDeepSeek()">
        Ask DeepSeek ↗
      </button>
      <button class="quick-btn" onclick="clearQuick()">Clear</button>
    </div>

    <script>
      // =====================================================
      // RAG base — the service that turns a source URL
      // into a chunked context the LLM can consume
      // =====================================================
      const RAG_BASE = "https://rag.songdrop.band/?url=";

      // Default source URLs for each panel
      const SOURCE_1 = "https://github.com/BohemiaInteractive/CWR";
      const SOURCE_3 =
        "https://github.com/heaven-hm/project-igi-research-data/tree/main";

      // =====================================================
      // Build RAG links for panels 1 and 3
      // =====================================================
      function refreshRagLinks() {
        const rag1 = document.getElementById("rag-1");
        const rag3 = document.getElementById("rag-3");
        rag1.value = RAG_BASE + encodeURIComponent(SOURCE_1);
        rag3.value = RAG_BASE + encodeURIComponent(SOURCE_3);
      }

      // =====================================================
      // Copy a single panel's RAG link
      // =====================================================
      function copyRag(panelNum) {
        const input = document.getElementById("rag-" + panelNum);
        if (!input || !input.value) return;
        navigator.clipboard.writeText(input.value);
        toast("📋 RAG link copied from Panel " + panelNum);
      }

      // =====================================================
      // Add a panel's RAG link to the shared context bar
      // (deduplicated — one entry per source URL)
      // =====================================================
      function addRagToQuick(panelNum) {
        const ragInput = document.getElementById("rag-" + panelNum);
        const quickInput = document.getElementById("quick-url-input");
        if (!ragInput || !ragInput.value) return;

        // Pull existing URLs out of the current quick bar value
        const urls = parseUrlsFromQuick(quickInput.value);

        // Extract the source URL from the panel's RAG link
        const m = ragInput.value.match(/url=([^&]+)/);
        if (!m) return;
        const source = decodeURIComponent(m[1]);

        // Dedupe
        if (!urls.includes(source)) {
          urls.push(source);
        }

        quickInput.value = buildMegaRag(urls);
        quickInput.select();
        toast("🔗 Context now has " + urls.length + " source(s)");
      }

      // =====================================================
      // Parse the URLs currently sitting in the quick bar
      // =====================================================
      function parseUrlsFromQuick(value) {
        if (!value) return [];
        const matches = [...value.matchAll(/url=([^&]+)/g)];
        return matches.map((m) => decodeURIComponent(m[1]));
      }

      // =====================================================
      // Build a single multi-URL RAG link
      // =====================================================
      function buildMegaRag(urls) {
        if (!urls.length) return "";
        let out = "https://rag.gitgpt.chat/?";
        urls.forEach((u, i) => {
          out += "url=" + encodeURIComponent(u);
          if (i < urls.length - 1) out += "&";
        });
        return out;
      }

      // =====================================================
      // Copy the current context
      // =====================================================
      function copyQuick() {
        const v = document.getElementById("quick-url-input").value;
        if (!v) return toast("Context is empty");
        navigator.clipboard.writeText(v);
        toast("📋 Context copied");
      }

      // =====================================================
      // Open DeepSeek in a new tab. The context must be
      // pasted into the chat — cross-origin iframes can't
      // receive query params from us.
      // =====================================================
      function openInDeepSeek() {
        const v = document.getElementById("quick-url-input").value;
        if (v) {
          navigator.clipboard.writeText(v).catch(() => {});
          toast("📋 Context copied — paste into DeepSeek");
        }
        window.open("https://chat.deepseek.com", "_blank", "noopener");
      }

      // =====================================================
      // Clear the context bar
      // =====================================================
      function clearQuick() {
        document.getElementById("quick-url-input").value = "";
        toast("Cleared");
      }

      // =====================================================
      // Toast
      // =====================================================
      function toast(msg) {
        const t = document.createElement("div");
        t.style.cssText = `
        position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);
        background: #2d2d30; color: white; padding: 10px 20px;
        border-radius: 30px; z-index: 1000; border: 1px solid #3e3e42;
        font-size: 12px;
      `;
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 1800);
      }

      // =====================================================
      // Resizable panels (3-panel version)
      // =====================================================
      const panels = [
        document.getElementById("panel-1"),
        document.getElementById("panel-2"),
        document.getElementById("panel-3"),
      ];
      const minWidths = [180, 180, 180];

      let layout = { w1: 33.33, w2: 33.33, w3: 33.34 };
      let isResizing = false;
      let activeResizer = null;
      let startX = 0;
      let startWidths = [0, 0, 0];

      function applyLayout() {
        const cw = document.querySelector(".app-container").clientWidth;
        panels[0].style.width = (cw * layout.w1) / 100 + "px";
        panels[1].style.width = (cw * layout.w2) / 100 + "px";
        panels[2].style.width = (cw * layout.w3) / 100 + "px";
      }

      function loadLayout() {
        try {
          const saved = localStorage.getItem("ofp_igi_llm_layout");
          if (saved) {
            const d = JSON.parse(saved);
            if (d.w1 && d.w2 && d.w3) layout = d;
          }
        } catch (e) {}
        applyLayout();
      }

      function saveLayout() {
        localStorage.setItem("ofp_igi_llm_layout", JSON.stringify(layout));
      }

      // Attach resizer handlers
      document.querySelectorAll(".resizer").forEach((r, idx) => {
        r.addEventListener("mousedown", (e) => {
          e.preventDefault();
          isResizing = true;
          activeResizer = idx; // 0 = between 1 and 2; 1 = between 2 and 3
          startX = e.clientX;
          startWidths = panels.map((p) => p.clientWidth);
          document.body.classList.add("resizing");
          document.body.style.cursor = "col-resize";
        });
      });

      document.addEventListener("mousemove", (e) => {
        if (!isResizing) return;

        const cw = document.querySelector(".app-container").clientWidth;
        const dx = e.clientX - startX;

        if (activeResizer === 0) {
          // Divider between panel 1 and panel 2
          const pair = startWidths[0] + startWidths[1];
          let w1 = startWidths[0] + dx;
          w1 = Math.max(minWidths[0], Math.min(pair - minWidths[1], w1));
          const w2 = pair - w1;
          const w3 = startWidths[2];

          panels[0].style.width = w1 + "px";
          panels[1].style.width = w2 + "px";
          panels[2].style.width = w3 + "px";
        } else {
          // Divider between panel 2 and panel 3
          const pair = startWidths[1] + startWidths[2];
          let w2 = startWidths[1] + dx;
          w2 = Math.max(minWidths[1], Math.min(pair - minWidths[2], w2));
          const w3 = pair - w2;
          const w1 = startWidths[0];

          panels[0].style.width = w1 + "px";
          panels[1].style.width = w2 + "px";
          panels[2].style.width = w3 + "px";
        }
      });

      document.addEventListener("mouseup", () => {
        if (!isResizing) return;
        isResizing = false;
        activeResizer = null;
        document.body.classList.remove("resizing");
        document.body.style.cursor = "";

        const cw = document.querySelector(".app-container").clientWidth;
        layout = {
          w1: (panels[0].clientWidth / cw) * 100,
          w2: (panels[1].clientWidth / cw) * 100,
          w3: (panels[2].clientWidth / cw) * 100,
        };
        saveLayout();
      });

      // =====================================================
      // Init
      // =====================================================
      document.addEventListener("DOMContentLoaded", () => {
        loadLayout();
        refreshRagLinks();

        // Recompute on window resize
        let t;
        window.addEventListener("resize", () => {
          clearTimeout(t);
          t = setTimeout(applyLayout, 100);
        });
      });
    </script>
  </body>
</html>
